<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digita el usuario para seguir</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/styles.css" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Roboto", sans-serif;
        background: #f4f7fb;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .verify-container {
        width: 100%;
        max-width: 430px;
        background: #fff;
        border-radius: 18px;
        padding: 40px 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      .verify-logo {
        width: 90px;
        margin-bottom: 20px;
      }

      .verify-title {
        font-size: 28px;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 10px;
      }

      .verify-subtitle {
        color: #6b7280;
        font-size: 15px;
        line-height: 1.5;
        margin-bottom: 30px;
      }

      .verify-error {
        display: none;
        background: #fee2e2;
        color: #b91c1c;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 20px;
        font-size: 14px;
      }

      .verify-success {
        display: none;
        background: #dcfce7;
        color: #166534;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 20px;
        font-size: 14px;
      }

      .code-inputs {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 30px;
      }

      .code-input {
        width: 52px;
        height: 58px;
        border: 2px solid #d1d5db;
        border-radius: 12px;
        text-align: center;
        font-size: 24px;
        font-weight: 700;
        outline: none;
        transition: 0.2s;
      }

      .code-input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
      }

      .verify-btn {
        width: 100%;
        border: none;
        background: #2563eb;
        color: white;
        padding: 14px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
      }

      .verify-btn:hover {
        background: #1d4ed8;
      }

      .verify-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .verify-footer {
        margin-top: 25px;
        font-size: 14px;
        color: #6b7280;
      }

      .verify-footer a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
      }

      .telegram-info {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #eff6ff;
        color: #1d4ed8;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 25px;
        font-size: 14px;
      }

      @media (max-width: 480px) {
        .verify-container {
          padding: 30px 20px;
        }

        .text {
          width: 45px;
          height: 52px;
          font-size: 22px;
        }
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }

      .input-group label {
        font-size: 14px;
        font-weight: 600;
        color: #333;
      }

      .text-input {
        width: 100%;
        padding: 12px 14px;
        border: 2px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
        transition: all 0.3s ease;
        outline: none;
        margin-bottom: 20px;
      }

      .text-input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
      }

      .text-input::placeholder {
        color: #999;
      }
    </style>
  </head>
  <body>
    <div class="verify-container">
      <img src="/images/logohic.png" alt="Logo" class="verify-logo" />

      <h1 class="verify-title">Verificar usuario</h1>

      <div id="verifyError" class="verify-error"></div>

      <div id="verifySuccess" class="verify-success"></div>

      <form id="verifyCodeForm">
        <div class="input-group">
          <input
            type="text"
            id="username"
            name="username"
            class="text-input"
            maxlength="15"
            placeholder="Ingrese su usuario"
            autocomplete="username"
            required
          />
        </div>

        <button type="submit" class="verify-btn">Verificar usuario</button>
      </form>
    </div>

    <script>
      const inputs = document.querySelectorAll(".text");

      inputs.forEach((input, index) => {
        input.addEventListener("input", (e) => {
          e.target.value = e.target.value.replace(/\D/g, "");

          if (e.target.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        input.addEventListener("paste", (e) => {
          e.preventDefault();

          const paste = (e.clipboardData || window.clipboardData)
            .getData("text")
            .replace(/\D/g, "")
            .slice(0, 6);

          paste.split("").forEach((char, i) => {
            if (inputs[i]) {
              inputs[i].value = char;
            }
          });
        });
      });

      document
        .getElementById("verifyCodeForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const errorBox = document.getElementById("verifyError");
          const successBox = document.getElementById("verifySuccess");

          errorBox.style.display = "none";
          successBox.style.display = "none";

          const code = [...inputs].map((input) => input.value).join("");

          if (code.length < 15) {
            errorBox.textContent =
              "El usuario debe tener al menos 15 caracteres";
            errorBox.style.display = "block";
            return;
          }

          const btn = document.querySelector(".verify-btn");

          try {
            btn.disabled = true;
            btn.textContent = "Verificando...";

            // Aquí luego conectamos el endpoint
            console.log("Usuario:", code);

            successBox.textContent = "Usuario verificado correctamente";
            successBox.style.display = "block";

            setTimeout(() => {
              window.location.href = "/reset-password";
            }, 1200);
          } catch (err) {
            errorBox.textContent = err.message;
            errorBox.style.display = "block";
          } finally {
            btn.disabled = false;
            btn.textContent = "Verificar Usuario";
          }
        });
    </script>
  </body>
</html>
