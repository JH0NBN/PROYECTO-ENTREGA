<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="verify-container">
      <img src="/images/logohic.png" alt="Logo HIC" class="verify-logo" />

      <h1 class="verify-title">Recuperar contraseña</h1>
      <p class="verify-subtitle">Ingresa tu usuario y te enviaremos un código de verificación por Telegram.</p>

      <div id="verifyError" class="verify-error" role="alert"></div>
      <div id="verifySuccess" class="verify-success" role="status"></div>

      <form id="userForgotForm" novalidate>
        <div class="input-group">
          <label for="username">Usuario</label>
          <input
            type="text"
            id="username"
            name="username"
            class="text-input"
            placeholder="Ingrese su usuario"
            autocomplete="username"
            required
          />
        </div>

        <button type="submit" class="verify-btn">
          <span class="material-icons" style="font-size:18px;vertical-align:middle;margin-right:6px;">send</span>
          Enviar código
        </button>
      </form>

      <div class="verify-footer">
        <a href="/login">← Volver al inicio de sesión</a>
      </div>
    </div>

    <script src="/js/user-forgot-password.js" defer></script>
  </body>
</html>
